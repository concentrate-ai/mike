name: mike

# ---------------------------------------------------------------------------
# Mike — application services
#
# This compose file runs the Mike frontend and backend. It requires a
# Supabase instance (cloud or self-hosted) for auth and database.
#
# Quick start:
#   1. Copy .env.example to .env and fill in the required values
#   2. docker compose up -d
#
# With Ollama (local LLM, requires NVIDIA GPU + nvidia-container-toolkit):
#   docker compose --profile ollama up -d
#
# Supabase options:
#   - Supabase Cloud: create a project at supabase.com, set SUPABASE_URL
#     and keys in .env
#   - Self-hosted local: run `supabase start` in this directory, then
#     set SUPABASE_URL=http://host-gateway:54321 and use the keys from
#     `supabase status`
# ---------------------------------------------------------------------------

services:

  # ── Mike Backend (Express API) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host-gateway:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      PORT: 4001
      FRONTEND_URL: ${SITE_URL:?required}
      SUPABASE_URL: ${SUPABASE_URL:?required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?required}
      CONCENTRATE_API_KEY: ${CONCENTRATE_API_KEY:-}
      CONCENTRATE_RESPONSES_URL: ${CONCENTRATE_RESPONSES_URL:-}
      USER_API_KEYS_ENCRYPTION_SECRET: ${USER_API_KEYS_ENCRYPTION_SECRET:?required}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      GENERIC_BASE_URL: ${GENERIC_BASE_URL:-}
      GENERIC_API_KEY: ${GENERIC_API_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-mike}
      RESEND_API_KEY: ${RESEND_API_KEY:-}

  # ── Mike Frontend (Next.js) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${SUPABASE_ANON_KEY:?required}
        NEXT_PUBLIC_API_BASE_URL: /api/backend
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"   # only port that needs to be publicly accessible
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 4000
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${SUPABASE_ANON_KEY:?required}
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?required}
      BACKEND_INTERNAL_URL: http://backend:4001
      SUPABASE_INTERNAL_URL: ${SUPABASE_URL:?required}

  # ── Ollama (optional, GPU recommended) ────────────────────────────────────
  # Enable with: docker compose --profile ollama up -d
  # Requires nvidia-container-toolkit on the host.
  #
  # Set OLLAMA_BASE_URL=http://ollama:11434/v1/responses in .env when using
  # this profile. On first start, run:
  #   docker compose exec ollama ollama pull qwen3:30b-a3b
  # or set OLLAMA_MODEL in .env and the ollama-init service will pull it.
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    profiles:
      - ollama
    depends_on:
      - ollama
    restart: on-failure
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama to be ready...';
        until ollama list > /dev/null 2>&1; do sleep 2; done;
        echo 'Pulling ${OLLAMA_MODEL:-qwen3:30b-a3b}...';
        ollama pull ${OLLAMA_MODEL:-qwen3:30b-a3b};
        echo 'Done.';
      "
    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  ollama-data:
